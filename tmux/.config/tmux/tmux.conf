set -g prefix C-s

set -s escape-time 0

set -g mouse on
set -g set-clipboard on
set -g extended-keys on

set -g base-index 1
set -g pane-base-index 1

# reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# kill session
bind-key K choose-tree -sZ "kill-session -t '%%'"

setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

bind b set-option -g status
bind C-b set-option -g status

# Cycle between window
# bind -n C-M-p previous-window
# bind -n C-M-n next-window

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# app launchers
bind e run-shell "bash ~/.config/tmux/yazi-launch.sh"
bind A run-shell "bash ~/.config/tmux/floax-launch.sh atuin"
bind g run-shell "bash ~/.config/tmux/floax-launch.sh lazygit"
bind d run-shell "bash ~/.config/tmux/floax-launch.sh lazydocker"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/tmux-sessionx'

set -g @continuum-restore 'on'
set -g @floax-bind 'f'

set -g @sessionx-bind 'a'
set -g @sessionx-filter-current 'false'
set -g @sessionx-filtered-sessions ''
set -g @sessionx-preview-enabled 'false'
set -g @sessionx-layout 'default'
set -g @floax-text-color '#ebdbb2'

# set -g @floax-change-path 'false'

run '~/.config/tmux/plugins/tpm/tpm'

# set -g status-style bg=default
# set -g status-left '[#{session_name}] #{prefix_highlight}'
# set -g status-left-length 85
# set -g status-right '%H:%M'
# set -g status-justify absolute-centre
# set -g window-status-style bg=default,fg=#dccedf
# set -g window-status-current-style bg=default,fg=#ffffff
# set -g message-style 'fg=colour2 bg=colour0 bold'

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme (gruvbox)
set -g status-style "bg=default,fg=#ebdbb2"
set -g status-left "#[fg=#282828,bg=#fe8019,bold] #S "
set -g status-right "#[fg=#fb4934]#{?pane_in_mode,COPY ,}#[fg=#fabd2f]#{?client_prefix,PREFIX ,}#[fg=#fe8019]#{?window_zoomed_flag,ZOOM ,}#[fg=#928374]#h "
set -g window-status-format "#[fg=#928374] #I:#W "
set -g window-status-current-format "#[fg=#fbf1c7,bold] #I:#W "
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fe8019"
set -g message-style "bg=#3c3836,fg=#ebdbb2"
set -g message-command-style "bg=#3c3836,fg=#ebdbb2"
set -g mode-style "bg=#fe8019,fg=#282828"
setw -g clock-mode-colour "#fe8019"
